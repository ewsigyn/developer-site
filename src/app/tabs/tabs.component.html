<div class="tabs-container locked-bottom">
  <div
    *ngFor="let tab of tabs"
    class="tab"
    [class.hidden]="activeTab === tab"
    (click)="selectTab(tab)"
  >
    <div class="tab-title">
      {{ tab.title }}
    </div>
  </div>
</div>

<div *ngIf="activeTab" class="backdrop" (click)="closeTab()"></div>

<div *ngIf="activeTab" class="content-panel">
  <button class="close-button" (click)="closeTab()">×</button>
  <ng-container *ngComponentOutlet="activeTab.component"></ng-container>
</div>
